<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>桥梁结构监测与限行决策</title><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;max-width:900px;margin:2rem auto;padding:0 1rem;color:#17212b}pre{background:#f4f7f9;padding:1rem;overflow:auto}button{padding:.55rem 1rem}</style></head><body><h1>桥梁结构监测与限行决策</h1><p>登记传感峰值、巡检缺陷、车型轴重和桥面天气，按最高风险给出观察、限载、限行或封闭建议，触发项写入建议版本。</p><p>新增或复核数据后自动重算，旧建议失效留档；工程与路政分别会签，不一致先待决，不能直接放行；恢复须缺陷关闭且路政确认撤除通告。</p><button onclick="loadItems()">刷新列表</button> <button onclick="loadRecs()">查看1号建议版本</button><pre id="out">使用X-Actor和X-Role请求头调用接口。</pre><script>async function loadItems(){const r=await fetch('/api/items',{headers:{'X-Actor':'demo','X-Role':'viewer'}});document.getElementById('out').textContent=JSON.stringify(await r.json(),null,2)}async function loadRecs(){const r=await fetch('/api/items/1/recommendations',{headers:{'X-Actor':'demo','X-Role':'viewer'}});document.getElementById('out').textContent=JSON.stringify(await r.json(),null,2)}</script></body></html>
